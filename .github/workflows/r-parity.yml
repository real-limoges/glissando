name: R parity (nightly)

# Statistical-correctness gate against the R reference implementations:
#   - StudentT  vs  gamlss TF()   (like-for-like RS oracle: same μ/σ/ν parameterization)
#   - other families  vs  mgcv
#
# This is intentionally OUT of the per-commit `rust.yml` pipeline: installing R plus
# arrow / mgcv / gamlss is slow, so it runs on a nightly schedule (and on demand via
# the "Run workflow" button). It regenerates the reference data with
# `benchmark/run_comparison.sh`, then runs the otherwise-`#[ignore]`d parity test that
# reads `benchmark/output/comparison_summary.json`.

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  r-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libopenblas-dev \
            gfortran

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # Posit Public Package Manager serves precompiled Ubuntu binaries, so the
          # heavy packages (arrow, gamlss) install in seconds instead of compiling.
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("arrow", "mgcv", "gamlss", "jsonlite"))'

      - name: Install uv (Python orchestrator)
        uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate reference data (mgcv + gamlss)
        run: bash benchmark/run_comparison.sh

      - name: Assert parity against R
        run: cargo test --test mgcv_reference -- --ignored --nocapture
