[package]
name = "glissando"
version = "0.1.0"
edition = "2021"
description = "GAMLSS implementation in Rust — generalized additive models for location, scale, and shape"
license = "MIT"
repository = "https://github.com/real-limoges/glissando"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["openblas", "parallel"]

# Backend selection (mutually exclusive in practice)
openblas = ["ndarray-linalg", "argmin-math/ndarray_latest"]
pure-rust = ["nalgebra"]

# Serialization support (serde + ndarray/serde)
serialization = ["serde", "serde_json", "ndarray/serde", "indexmap/serde"]

# WASM target (implies pure-rust + serialization, no parallel)
wasm = ["pure-rust", "serialization", "wasm-bindgen", "getrandom_02", "getrandom_03", "getrandom"]

# PyO3 Integration (includes openblas backend + parallel for performance)
python = ["pyo3", "numpy", "serialization", "openblas", "parallel"]

# Parallelism (incompatible with WASM)
parallel = ["rayon"]

# Test-only: enables Rust-side unit tests of the PyO3 bindings.
# `pyo3/extension-module` (pulled in via `python`) prevents `cargo test` from linking
# against libpython, so tests of `src/python.rs` must opt into `auto-initialize`.
test-python = ["python", "pyo3/auto-initialize"]

[dependencies]
argmin = { version = "0.11.0"}
indexmap = { version = "2" }
ndarray = { version = "0.17" }
rand = { version = "0.10" }
rand_distr = { version = "0.6" }
statrs = { version = "0.18.0" }
thiserror = { version = "2.0" }

# Optional: Linear algebra backends
ndarray-linalg = { version = "0.18", features = ["openblas-system"], optional = true }
nalgebra = { version = "0.33", optional = true }

# Optional: Parallelism
rayon = { version = "1.11", optional = true }

# Optional: Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
# `float_roundtrip` makes f64 *parsing* correctly-rounded; without it serde_json's
# fast parser can land 1 ULP off, so a save/load round-trip of model coefficients
# is not bit-exact (Ryu serialization is already exact). Required for
# `GamlssModel::to_json`/`from_json` to preserve predictions.
serde_json = { version = "1.0", features = ["float_roundtrip"], optional = true }

# Optional: WASM support
wasm-bindgen = { version = "0.2.108", optional = true }

# getrandom is a transitive dependency, but we explicitly depend on three majors so
# the right WASM features are enabled for each. The triplication tracks distinct rand
# majors pinned by upstreams (verified against latest crates.io versions):
#   v0.2 — pulled in by statrs 0.18 → rand 0.8
#   v0.3 — pulled in by argmin 0.11 → rand 0.9
#   v0.4 — pulled in by our direct rand 0.10 dependency
# These cannot be collapsed without forking or upstream major-version bumps.
getrandom_02 = { package = "getrandom", version = "0.2", optional = true, features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", optional = true, default-features = false, features = ["wasm_js"] }
getrandom = { version = "0.4", optional = true, default-features = false, features = ["wasm_js"] }

# Optional: PyO3
# Note: extension-module is used for building Python modules, but not for running tests
# When testing, PyO3 needs to link to Python. For this, we rely on pyo3/auto-initialize in dev-dependencies
pyo3 = { version = "0.28.0", features = ["extension-module"], optional = true }
numpy = { version = "0.28.0", optional = true }

# `argmin-math 0.5.1` brings its own pin to `ndarray 0.16` + `ndarray-linalg 0.17`,
# which coexist with our direct `ndarray 0.17` + `ndarray-linalg 0.18`. The
# duplication shows up in `cargo tree --duplicates` and inflates binary size but
# does not break the build: each `argmin-math` operation that hits an ndarray type
# uses the older ndarray, and our solver/IRLS code goes through the newer one. The
# top-level `ndarray_latest-nolinalg` feature is required for pure-rust builds
# (gives argmin its ndarray ops without dragging ndarray-linalg into that backend);
# the `openblas` feature additionally turns on `ndarray_latest` so argmin can use
# the system OpenBLAS path. Consolidating the duplication requires an upstream
# `argmin-math` release that bumps its ndarray pin — tracked, not actionable here.
[dependencies.argmin-math]
version = "0.5.1"
features = ["ndarray_latest-nolinalg"]

[dev-dependencies]
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# criterion pulls rayon, proptest pulls wait-timeout — neither compiles for wasm32.
# Scope both to non-wasm targets so wasm-pack test can build the test crate.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"
insta = { version = "1.40", features = ["yaml"] }
proptest = "1.5"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "derivatives"
harness = false

[workspace]
members = ["benchmark"]
